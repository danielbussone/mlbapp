server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # SPA: serve the file if it exists, else fall back to index.html for client routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse-proxy the API. Upstream host `api` is the docker-compose service name
    # (works when web + api are co-located, e.g. compose or a single ECS task).
    # For split deploys (web on S3+CloudFront, api behind an ALB), route /api/* at
    # the CDN/load balancer instead and this block is unused.
    location /api/ {
        proxy_pass http://api:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /chat streams via SSE and one request can run many tool rounds — disable
        # buffering and allow long-lived upstream reads so streams aren't cut off.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        chunked_transfer_encoding on;
    }
}
